function uuid() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
}

function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = String(str ?? '');
    return div.innerHTML;
}

function parseFloatSafe(v, def = 0) {
    if (v === null || v === undefined || v === '') return def;
    const parsed = parseFloat(String(v).replace(',', '.'));
    return isNaN(parsed) ? def : parsed;
}

function formatTime(ms) {
    ms = Number(ms) || 0;
    if (ms <= 0) return '00:00';
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function calculerDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
    const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
    const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function isValidCoordinate(lat, lon) {
    const latNum = parseFloat(lat), lonNum = parseFloat(lon);
    return !isNaN(latNum) && !isNaN(lonNum) && 
           Math.abs(latNum) <= 90 && Math.abs(lonNum) <= 180 &&
           !(latNum === 0 && lonNum === 0) &&
           latNum < 100000 && lonNum < 100000;
}

function debounce(fn, delay) {
    let timer = null;
    return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
    };
}

// 💾 STOCKAGE LOCAL & INDEXEDDB
// ============================================================
class Database {
    constructor() {
        this.db = null;
        this.ready = this.init();
    }
    
    async init() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(CONFIG.DB_NAME, 1);
            req.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(CONFIG.STORE_NAME)) {
                    db.createObjectStore(CONFIG.STORE_NAME, { keyPath: 'id' });
                }
            };
            req.onsuccess = e => { this.db = e.target.result; resolve(); };
            req.onerror = e => reject(new Error("Erreur ouverture BD: " + e.target.error));
        });
    }
    
    async getAll() {
        await this.ready;
        return new Promise((resolve, reject) => {
            const t = this.db.transaction(CONFIG.STORE_NAME, 'readonly');
            const req = t.objectStore(CONFIG.STORE_NAME).getAll();
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(new Error("Erreur lecture"));
        });
    }
    
    async put(item) {
        await this.ready;
        return new Promise((resolve, reject) => {
            const t = this.db.transaction(CONFIG.STORE_NAME, 'readwrite');
            t.objectStore(CONFIG.STORE_NAME).put(item);
            t.oncomplete = () => resolve();
            t.onerror = () => reject(new Error("Erreur sauvegarde"));
        });
    }
    
    async clear() {
        await this.ready;
        return new Promise((resolve, reject) => {
            const t = this.db.transaction(CONFIG.STORE_NAME, 'readwrite');
            t.objectStore(CONFIG.STORE_NAME).clear();
            t.oncomplete = () => resolve();
            t.onerror = () => reject(new Error("Erreur effacement"));
        });
    }
}

class Storage {
    static get(key, def = null) {
        try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } 
        catch { return def; }
    }
    static set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); return true; } 
        catch (e) { console.warn("Stockage plein:", e); return false; }
    }
    static remove(key) {
        try { localStorage.removeItem(key); } catch {}
    }
}

// ⏱️ CHRONOMÈTRE
// ============================================================
class ChronoManager {
    constructor() {
        this.state = { startTime: null, accumulated: 0, running: false, pausedAt: null };
        this.interval = null;
        this.load();
    }
    
    load() {
        const saved = Storage.get('chrono_state');
        if (saved) this.state = { ...this.state, ...saved };
        if (this.state.running && this.state.startTime) this.startInterval();
        this.updateUI();
    }
    
    save() { Storage.set('chrono_state', this.state); }
    
    getElapsedMs() {
        let total = Number(this.state.accumulated) || 0;
        if (this.state.running && this.state.startTime) {
            total += Date.now() - this.state.startTime;
        }
        return total;
    }
    
    start() {
        if (this.state.running) return;
        this.state.startTime = Date.now();
        this.state.running = true;
        this.state.pausedAt = null;
        this.save();
        this.startInterval();
        this.updateUI();
    }
    
    pause() {
        if (!this.state.running) return;
        this.state.accumulated += Date.now() - this.state.startTime;
        this.state.running = false;
        this.state.pausedAt = Date.now();
        this.save();
        this.stopInterval();
        this.updateUI();
    }
    
    reset(confirmMsg = true) {
        if (confirmMsg && !confirm('Réinitialiser le chronomètre ? Les temps enregistrés sont conservés.')) return;
        this.state = { startTime: null, accumulated: 0, running: false, pausedAt: null };
        this.save();
        this.stopInterval();
        this.updateUI();
    }
    
    startInterval() {
        this.stopInterval();
        this.interval = setInterval(() => this.updateUI(), 1000);
    }
    
    stopInterval() {
        if (this.interval) { clearInterval(this.interval); this.interval = null; }
    }
    
    updateUI() {
        const disp = document.getElementById('chronoDisplay');
        const status = document.getElementById('chronoStatus');
        const header = document.getElementById('headerChrono');
        const timeStr = formatTime(this.getElapsedMs());
        
        if (disp) disp.textContent = timeStr;
        disp?.classList.toggle('paused', !this.state.running);
        
        if (this.state.running) {
            if (status) status.textContent = '⏱️ En cours…';
            if (header) { 
                header.textContent = '⏱️ ' + timeStr; 
                header.style.display = 'inline-block';
                header.classList.remove('paused');
            }
        } else if (this.state.accumulated > 0 || this.state.pausedAt) {
            if (status) status.textContent = '⏸️ En pause';
            if (header) { 
                header.textContent = '⏸️ ' + timeStr; 
                header.style.display = 'inline-block';
                header.classList.add('paused');
            }
        } else {
            if (status) status.textContent = 'En attente du démarrage';
            if (header) header.style.display = 'none';
        }
    }
}
