<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0055A4">
<title>Relevé Chambres - TOP SAT SERVICES</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#f5f5f5; color:#222; }
header { background:#0055A4; color:#fff; padding:12px 16px; position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:12px; box-shadow:0 2px 6px rgba(0,0,0,.15); }
header h1 { font-size:17px; margin:0; flex:1; }
header button { background:transparent; border:0; color:#fff; font-size:22px; padding:4px 8px; cursor:pointer; }
main { padding:16px; max-width:800px; margin:0 auto; padding-bottom:100px; }
.card { background:#fff; border-radius:10px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.btn { display:inline-block; background:#0055A4; color:#fff; border:0; padding:14px 20px; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; width:100%; text-align:center; text-decoration:none; }
.btn:active { opacity:.85; }
.btn-secondary { background:#ccc; color:#333; }
.btn-success { background:#2e7d32; }
.btn-danger { background:#c62828; }
.btn-waze { background:#33ccff; color:#fff; padding:12px 16px; font-size:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:bold; width:100%; margin-bottom:8px;}
.btn-maps { background:#4285F4; color:#fff; padding:12px 16px; font-size:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:bold; width:100%;}
input, select, textarea { width:100%; padding:12px; font-size:16px; border:1px solid #ccc; border-radius:8px; background:#fff; font-family:inherit; }
label { display:block; font-weight:600; margin-bottom:6px; margin-top:12px; font-size:14px; color:#444; }
.photo-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
.photo-wrapper { display: block; width: 100%; }
.photo-btn { position:relative; aspect-ratio:1; background:#eef3f8; border:2px dashed #b0c4d8; border-radius:10px; overflow:hidden; }
.photo-btn label { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-size:11px; color:#0055A4; text-align:center; padding:4px; margin:0; font-weight:600; }
.photo-btn .icon { font-size:22px; margin-bottom:2px; }
.photo-btn img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.photo-btn .badge { position:absolute; top:4px; left:4px; background:#0055A4; color:#fff; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; z-index:2; }
.photo-btn .photo-del { position:absolute; bottom:4px; right:4px; background:rgba(198,40,40,.95); color:#fff; border:0; width:26px; height:26px; border-radius:50%; font-size:16px; cursor:pointer; z-index:2; }
.photo-btn input[type=file] { display:none; }
.list-item { padding:14px 16px; background:#fff; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.06); gap:10px; }
.list-item:active { background:#f0f0f0; }
.status-badge { font-size:12px; padding:4px 10px; border-radius:12px; font-weight:600; white-space:nowrap; }
.status-todo { background:#fff3e0; color:#e65100; }
.status-done { background:#e8f5e9; color:#2e7d32; }
.hidden { display:none !important; }
.small { font-size:13px; color:#666; }
.empty { text-align:center; padding:40px 20px; color:#888; }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:100; }
.spinner { width:40px; height:40px; border:4px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
.stat { background:#eef3f8; padding:12px; border-radius:8px; text-align:center; }
.stat-num { font-size:24px; font-weight:bold; color:#0055A4; }
.stat-label { font-size:12px; color:#666; margin-top:2px; }
.passage-card { border: 2px solid #e0e0e0; border-radius: 12px; margin-bottom: 12px; padding: 16px; background: #fafafa; position:relative; }
.passage-card h4 { margin: 0 0 10px 0; font-size: 15px; color: #0055A4; }
.row-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.row-inputs input, .row-inputs select { padding: 8px; font-size: 14px; }
.info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:13px; margin-top:8px; }
.info-item { background:#f0f4f8; padding:8px; border-radius:6px; }
.info-item.clickable { cursor:pointer; text-decoration:underline; color:#0055A4; }
.toggle-container { display:flex; align-items:center; gap:10px; margin-top:10px; background:#eef3f8; padding:10px; border-radius:8px;}
.toggle-container input[type=checkbox] { width:20px; height:20px; margin:0; }
.toggle-container label { margin:0; font-size:14px; font-weight:normal;}
.footer-credits { text-align: center; font-size: 11px; color: #999; margin-top: 20px; margin-bottom: 20px; }
.mode-selector { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
.mode-btn { padding:16px; border:2px solid #0055A4; border-radius:10px; background:#fff; text-align:left; cursor:pointer; }
.mode-btn.active { background:#0055A4; color:#fff; }
.mode-btn h3 { margin:0 0 4px 0; font-size:16px; }
.mode-btn p { margin:0; font-size:12px; opacity:0.8; }
.label-row { display:flex; align-items:center; justify-content:space-between; margin-top:12px; margin-bottom:6px;}
.label-row label { margin:0; }
.help-icon { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; background:#0055A4; color:#fff; border-radius:50%; font-size:13px; font-weight:bold; cursor:pointer; }
.logo-container { text-align: center; padding: 10px 0; }
.logo-container img { max-width: 200px; max-height: 80px; object-fit: contain; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:200; }
.modal-content { background:#fff; width:90%; max-width:420px; border-radius:12px; padding:20px; max-height: 90vh; overflow-y: auto;}

/* CSS pour les soudures */
.splice-tube-block { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 10px; }
.splice-tube-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; color: #0055A4; }
.splice-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.splice-table th, .splice-table td { border: 1px solid #ccc; padding: 4px; text-align: center; }
.splice-table select, .splice-table input { padding: 4px; font-size: 12px; border-radius: 4px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; }
.splice-table input:disabled { background: #e0e0e0; color: #888; }
</style>
</head>

<script>
const DB_NAME='releve-chambres-v5', STORE='chambres';
let db=null, chambres=[], headers=[];
let modeTravail = 'aiguillage';
let editingId = null, editPendingLat = '', editPendingLon = '';
let logoGauche = null, logoDroite = null;
let pendingLat = '', pendingLon = '';

const couleursNoms = ['Rouge', 'Bleu', 'Vert', 'Jaune', 'Violet', 'Blanc', 'Orange', 'Gris', 'Marron', 'Noir', 'Turquoise', 'Rose'];
const couleursHex = { 'Rouge': [255, 0, 0], 'Bleu': [0, 0, 255], 'Vert': [0, 128, 0], 'Jaune': [255, 255, 0], 'Violet': [128, 0, 128], 'Blanc': [255, 255, 255], 'Orange': [255, 165, 0], 'Gris': [128, 128, 128], 'Marron': [139, 69, 19], 'Noir': [0, 0, 0], 'Turquoise': [64, 224, 208], 'Rose': [255, 192, 203] };

const PHOTO_CATS_AIGUILLAGE = [{id:'MA', label:'Masque A', icon:'🔘'}, {id:'MB', label:'Masque B', icon:'🔘'}, {id:'MC', label:'Masque C', icon:'🔘'}, {id:'MD', label:'Masque D', icon:'🔘'}, {id:'VUE_ENSEMBLE', label:'Vue ensemble', icon:'🌐'}];
const PHOTO_CATS_FOA = [{id:'MIRE_LG', label:'MIRE LG', icon:'📏'}, {id:'MIRE_L', label:'MIRE L', icon:'📏'}, {id:'MIRE_P', label:'MIRE P', icon:'📏'}, {id:'ETIQ_BOITE', label:'Étiq Boîte', icon:'🏷️'}, {id:'ETIQ_CABLE', label:'Étiq Câble', icon:'🏷️'}, {id:'VUE_ENSEMBLE', label:'Vue ens.', icon:'🌐'}, {id:'BOITE', label:'Boîte', icon:'📦'}, {id:'CABLE', label:'Câble', icon:'🔌'}, {id:'VUE_DESSUS_CH', label:'Vue dessus', icon:'📐'}];

function findRawKey(raw, aliases) {
  if (!raw) return null;
  const norm = s => String(s).toUpperCase().replace(/[_\s]/g, '');
  for (const a of aliases) {
    const target = norm(a);
    for (const k of Object.keys(raw)) { if (norm(k) === target) return k; }
  }
  return null;
}
function getRawValue(c, aliases, fallback) {
  if (!c || !c.raw) return fallback ?? '';
  const k = findRawKey(c.raw, aliases);
  if (!k) return fallback ?? '';
  return c.raw[k] ?? (fallback ?? '');
}
function getDisplayName(c) {
  if (!c) return '?';
  return getRawValue(c, ['CODE_CH1'], '') || c.id || '?';
}
function getDisplayNameById(id) {
  const c = chambres.find(x => x.id === id);
  return getDisplayName(c) || id;
}
function makeOrdreGeo(ordreVal) { const s = String(ordreVal ?? '').trim().replace(/^A/i, ''); return s ? 'A' + s : ''; }
function parseOrdreGeo(v) {
  if (v === null || v === undefined || v === '') return 999999;
  const m = String(v).toUpperCase().replace(/\s/g,'').match(/^A?(-?\d+(?:\.\d+)?)$/);
  if (m) return parseFloat(m[1]);
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 999999 : n;
}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parseFloatSafe(v, def = 0) { if (v === null || v === undefined) return def; const s = String(v).trim().replace(',', '.'); if (s === '') return def; const n = parseFloat(s); return isNaN(n) ? def : n; }
function getVal(row, ...keys) { for (const k of keys) { if (row[k] !== undefined && row[k] !== null && row[k] !== '') return row[k]; } return ''; }

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=e=>{db=e.target.result;res();};r.onerror=e=>rej(e.target.error);});}
function dbGetAll(){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbPut(item){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(item);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
function dbClear(){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).clear();t.oncomplete=res;t.onerror=()=>rej(t.error);});}

function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const first=text.split(/\r?\n/)[0]||'';
  const delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];
    if(inQ){if(c==='"'&&n==='"'){cur+='"';i++;}else if(c==='"')inQ=false;else cur+=c;}
    else{if(c==='"')inQ=true;else if(c===delim){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(c==='\r'){}else cur+=c;}}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.length>1||(r.length===1&&r[0].trim()!==''));
}
function esc(v,d){const s=String(v??'');return (s.includes(d)||s.includes('"')||s.includes('\n'))?'"'+s.replace(/"/g,'""')+'"':s;}

function generateCSV(){
  const currentCats = modeTravail === 'aiguillage' ? PHOTO_CATS_AIGUILLAGE : PHOTO_CATS_FOA;
  const sourceHeaders = headers.slice();
  let allHeaders = [...sourceHeaders];
  const extraCols = ['BPE_Origine','Observation_BPE','Commentaire_Terrain','LATITUDE','LONGITUDE', ...currentCats.map(c => `Nb_${c.id}`), 'CAPACITE'];
  const setUpper = new Set(allHeaders.map(h => h.toUpperCase().trim()));
  for (const col of extraCols) { if (!setUpper.has(col.toUpperCase())) { allHeaders.push(col); setUpper.add(col.toUpperCase()); } }

  const norm = s => s.toUpperCase().replace(/[_\s]/g,'');
  const findHeader = (aliases) => { for (const a of aliases) { const found = allHeaders.find(h => norm(h) === norm(a)); if (found) return found; } return null; };
  const H = {
    ordre: findHeader(['ORDRE']), ordreGeo: findHeader(['ORDRE_GEO']), codeCh1: findHeader(['CODE_CH1']), codeCh2: findHeader(['CODE_CH2']),
    refChambr: findHeader(['REF_CHAMBR']), proprietaire: findHeader(['PROPRIETAI']), commune: findHeader(['COMMUNE']), waze: findHeader(['WAZE']),
    wkt: findHeader(['wkt_geom']), bpe: findHeader(['BPE']), capacite: findHeader(['CAPACITE']), cable: findHeader(['CABLE']), etiquette2: findHeader(['ETIQUETTE_2']),
    numVoie: findHeader(['NUM_VOIE']), fci: findHeader(['FCI']), bpeOrigine: findHeader(['BPE_Origine']), obsBpe: findHeader(['Observation_BPE']), commentaire: findHeader(['Commentaire_Terrain']),
    latitude: findHeader(['LATITUDE']), longitude: findHeader(['LONGITUDE'])
  };

  const d=';';
  const lines=[allHeaders.map(h=>esc(h,d)).join(d)];
  const bpeRecues = {};
  for (const c of chambres) { if (!c.hasBoite && c.bpeDestination) { const bpeName = c.raw['BPE'] || ''; if (bpeName) (bpeRecues[c.bpeDestination] = bpeRecues[c.bpeDestination] || []).push(bpeName); } }

  for(const c of chambres){
    const p = (c.passages && c.passages[0]) ? c.passages[0] : {};
    let bpeFinal = c.raw['BPE'] || ''; let bpeOrigine = bpeFinal; let obsBpe = '';
    if (!c.hasBoite) { bpeFinal = ''; if (c.boiteNonPosee && !c.bpeDestination) obsBpe = 'BOITE NON POSEE'; else if (c.bpeDestination) obsBpe = `TRANSFEREE VERS : ${getDisplayNameById(c.bpeDestination)}`; } 
    else if (bpeRecues[c.id] && bpeRecues[c.id].length) { bpeFinal = bpeRecues[c.id].join(' + '); obsBpe = 'RECOIT BPE(S) : ' + bpeFinal; }

    const ordreGeoVal = c.raw[H.ordreGeo] || makeOrdreGeo(c.raw[H.ordre]);
    const ordreVal    = c.raw[H.ordre] ?? '';
    const logicalByHeader = new Map();
    Object.entries(H).forEach(([logical, hName]) => { if (hName) logicalByHeader.set(hName, logical); });

    const valFor = (logical) => {
      switch (logical) {
        case 'ordre': return ordreVal; case 'ordreGeo': return ordreGeoVal; case 'codeCh1': return c.raw[H.codeCh1] || ''; case 'codeCh2': return c.raw[H.codeCh2] || '';
        case 'refChambr': return c.raw[H.refChambr] || ''; case 'proprietaire': return c.raw[H.proprietaire] || ''; case 'commune': return c.raw[H.commune] || '';
        case 'waze': return c.raw[H.waze] || ''; case 'wkt': return c.raw[H.wkt] || ''; case 'bpe': return bpeFinal; case 'capacite': return c.capacite || c.raw[H.capacite] || '';
        case 'cable': return p.cable_name || c.raw[H.cable] || ''; case 'etiquette2': return c.raw[H.etiquette2] || ''; case 'numVoie': return c.raw[H.numVoie] || '';
        case 'fci': return c.raw[H.fci] || ''; case 'bpeOrigine': return bpeOrigine; case 'obsBpe': return obsBpe; case 'commentaire': return c.notes || '';
        case 'latitude': return c.lat || ''; case 'longitude': return c.lon || ''; default: return '';
      }
    };

    const row = allHeaders.map(h => {
      if (h.startsWith('Nb_')) return (c.photos[h.replace('Nb_', '')] || []).length;
      const logical = logicalByHeader.get(h);
      if (logical) return valFor(logical);
      return c.raw[h] || '';
    });
    lines.push(row.map(v=>esc(v,d)).join(d));
  }
  return lines.join('\r\n');
}

async function compress(file,maxDim=1920,q=0.85){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{let{width:w,height:h}=img;const s=Math.min(1,maxDim/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s); const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h); cv.toBlob(b=>{URL.revokeObjectURL(img.src);b?res(b):rej(new Error('compress'));},'image/jpeg',q);}; img.onerror=rej;img.src=URL.createObjectURL(file); });
}
const blobToDataURL = (blob) => new Promise((resolve) => { const reader = new FileReader(); reader.onload = (e) => resolve(e.target.result); reader.readAsDataURL(blob); });

function showScreen(name){
  document.querySelectorAll('main > section').forEach(s=>s.classList.add('hidden'));
  document.getElementById('screen-'+name).classList.remove('hidden');
  document.getElementById('backBtn').classList.toggle('hidden',name==='home');
  document.getElementById('title').textContent={home:'Relevé Chambres',list:'Chambres',detail:'Détail'}[name];
  window.scrollTo(0,0);
}
function showOverlay(s){document.getElementById('overlay').classList.toggle('hidden',!s);}

function updateHomeStats(){
  const total=chambres.length,done=chambres.filter(c=>c.done).length;
  let photos=0; for(const c of chambres) { for(const k in c.photos) photos+=(c.photos[k]||[]).length; }
  document.getElementById('statTotal').textContent=total; document.getElementById('statDone').textContent=done;
  document.getElementById('statPhotos').textContent=photos; document.getElementById('statTodo').textContent=total-done;
  document.getElementById('homeStats').style.display=total?'block':'none';
}
function updateImportLock() {
  const locked = chambres.length > 0;
  document.getElementById('importUnlocked').style.display = locked ? 'none' : 'block';
  document.getElementById('importLocked').style.display = locked ? 'block' : 'none';
}

function renderList(){
  const cont=document.getElementById('listContainer');
  if(!chambres.length){cont.innerHTML='<div class="empty">Aucune chambre.</div>';return;}
  cont.innerHTML='';
  for(const c of chambres){
    const div=document.createElement('div'); div.className='list-item';
    const commune = getRawValue(c, ['COMMUNE'], ''); const ref = getRawValue(c, ['REF_CHAMBR'], ''); const geo = c.raw['ORDRE_GEO'] || '';
    const sub = [geo ? `📌 ${geo}` : '', commune, ref].filter(Boolean).join(' • ');
    div.innerHTML=`<div style="min-width:0;flex:1;"><div style="font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(getDisplayName(c))}</div><div class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(sub)||'À renseigner'}</div></div><span class="status-badge ${c.done?'status-done':'status-todo'}">${c.done?'✓ Fait':'À faire'}</span>`;
    div.onclick=()=>openDetail(c.id); cont.appendChild(div);
  }
}

function photoSlot(catObj, arr){
  const cat = catObj.id; arr=arr||[]; const count=arr.length; const last=arr[count-1];
  let inner=`<div class="icon">${catObj.icon}</div><div>${catObj.label}</div>`;
  if(last){const u=URL.createObjectURL(last.blob);inner=`<img src="${u}">`;}
  return `<div class="photo-btn">${count?`<span class="badge">${count}</span>`:''}${count?`<button type="button" class="photo-del" data-del-cat="${cat}" data-cat-label="${catObj.label}">×</button>`:''}<label>${inner}<input type="file" accept="image/*" capture="environment" multiple data-cat="${cat}"></label></div>`;
}

function openDetail(id){
  const c=chambres.find(x=>x.id===id); if(!c) return;
  try { localStorage.setItem('derniereChambre', id); } catch(e){}
  if(!c.photos)c.photos={};
  PHOTO_CATS_AIGUILLAGE.forEach(p => { if(!c.photos[p.id]) c.photos[p.id] = []; });
  PHOTO_CATS_FOA.forEach(p => { if(!c.photos[p.id]) c.photos[p.id] = []; });
  if(!c.passages) c.passages = [{id: crypto.randomUUID(), cable_name:''}];
  if(c.hasBoite === undefined) c.hasBoite = true;
  if(!c.bpeDestination) c.bpeDestination = '';
  if(!c.notes) c.notes = '';
  
  const bpeOrigine = getRawValue(c, ['BPE', 'bpe'], '');
  const hasBpe = bpeOrigine && bpeOrigine.trim() !== '' && bpeOrigine.toLowerCase() !== 'none' && bpeOrigine.toLowerCase() !== 'nan';

  if (c.forceShowSoudure === undefined) c.forceShowSoudure = false;
  if (!c.capacite) c.capacite = parseInt(getRawValue(c, ['CAPACITE', 'capacite'], '48'), 10) || 48;
  if (!c.splicingData) c.splicingData = {};
  const nbTubes = Math.ceil(c.capacite / 12);
  for (let t = 1; t <= nbTubes; t++) {
    if (!c.splicingData[t]) c.splicingData[t] = { droit: true, fibers: Array.from({ length: 12 }, (_, i) => ({ status: 'soude', destTube: t, destFib: i + 1 })) };
  }

  const cont=document.getElementById('detailContainer');
  const displayName = getDisplayName(c);
  const numVoie = getRawValue(c, ['NUM_VOIE'], ''); const codeCh2 = getRawValue(c, ['CODE_CH2'], ''); const commune = getRawValue(c, ['COMMUNE'], ''); const refChambr= getRawValue(c, ['REF_CHAMBR'], ''); const proprietaire = getRawValue(c, ['PROPRIETAI'], '');
  const ordreGeo = c.raw['ORDRE_GEO'] || makeOrdreGeo(c.raw['ORDRE']) || '—'; const ordre = c.raw['ORDRE'] || '—'; const wazeUrlCsv = c.raw['WAZE'] || '';
  
  let navBtns = '';
  if (wazeUrlCsv && wazeUrlCsv.includes('waze.com')) { const match = wazeUrlCsv.match(/ll=([\d.-]+),([\d.-]+)/); let mapsUrl = match ? `https://www.google.com/maps/search/?api=1&query=${match[1]},${match[2]}` : wazeUrlCsv.replace('https://www.waze.com/ul?ll=', 'https://www.google.com/maps/search/?api=1&query=').replace('&navigate=yes', ''); navBtns = `<a href="${wazeUrlCsv}" target="_blank" class="btn btn-waze">🚗 Waze</a><a href="${mapsUrl}" target="_blank" class="btn btn-maps">📍 Maps</a>`; } 
  else if (c.lat && c.lon) { navBtns = `<a href="https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lon}" target="_blank" class="btn btn-maps">📍 Voir sur Maps</a>`; }
  
  const optionsDestination = chambres.filter(other => other.id !== c.id).map(other => `<option value="${other.id}" ${c.bpeDestination === other.id ? 'selected' : ''}>${escapeHTML(getDisplayName(other))}</option>`).join('');
  let csvCableVal = c.raw['CABLE'] || '';
  const passagesHtml = c.passages.map((p, index) => {
    const cableVal = p.cable_name || (index === 0 ? csvCableVal : '');
    return `<div class="passage-card" data-passage-id="${p.id}"><h4>Liaison ${index + 1}</h4><input type="text" placeholder="Nom du câble" value="${escapeHTML(cableVal)}" data-pass="${p.id}" data-field="cable_name" style="margin-bottom:10px;"></div>`;
  }).join('');

  const gpsDisplay = (c.lat && c.lon) ? `<span class="info-item clickable" style="grid-column: span 2; background:#e8f5e9;" onclick="window.open('https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lon}','_blank')">📍 ${escapeHTML(c.lat)}, ${escapeHTML(c.lon)}</span>` : `<span class="info-item" style="grid-column: span 2; background:#ffebee;">📍 Non renseigné</span>`;

  cont.innerHTML=`
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;"><div style="font-weight:700;font-size:18px;">Chambre ${escapeHTML(displayName)}</div><button id="editInfoBtn" class="btn btn-secondary" style="width:auto;padding:8px 12px;font-size:13px;background:#e3f2fd;color:#0055A4;">✏️ Modifier</button></div>
    <div class="info-grid" style="margin-bottom:12px;"><div class="info-item" style="grid-column: span 2; background:#fff8e1; border-left:4px solid #f9a825;"><b>ORDRE_GEO :</b> <span style="font-family:monospace;font-size:16px;color:#c62828;"><b>${escapeHTML(ordreGeo)}</b></span> <span class="small">(ORDRE : ${escapeHTML(ordre)})</span></div></div>
    <div class="info-grid">
      <div class="info-item"><b>CODE_CH1 :</b> ${escapeHTML(displayName)}</div>
      <div class="info-item"><b>CODE_CH2 :</b> ${escapeHTML(codeCh2) || '—'}</div>
      <div class="info-item"><b>PROPRIETAI :</b> ${escapeHTML(proprietaire) || '—'}</div>
      <div class="info-item"><b>REF_CHAMBR :</b> ${escapeHTML(refChambr) || '—'}</div>
      <div class="info-item" style="grid-column: span 2;"><b>COMMUNE :</b> ${escapeHTML(commune) || '—'}</div>
      <div class="info-item" style="grid-column: span 2; background:#e3f2fd;"><b>N° Voie :</b> ${escapeHTML(numVoie) || '—'}</div>
      ${gpsDisplay}
    </div>
    <div style="margin-top:12px; background:#e8eaf6; padding:10px; border-radius:8px; border:1px solid #c5cae9;">
      <label for="capaciteSelect" style="margin-top:0; color:#283593;">🔌 Capacité du câble (FO)</label>
      <select id="capaciteSelect" style="margin-top:5px; border-color:#9fa8da;">${[12, 24, 36, 48, 72, 96, 144, 288].map(cap => `<option value="${cap}" ${c.capacite == cap ? 'selected' : ''}>${cap} FO (${Math.ceil(cap/12)} cassettes)</option>`).join('')}</select>
    </div>
    <div style="margin-top:12px; text-align:center;">${navBtns}</div>
  </div>

  <div class="card"><label style="margin-top:0; font-size:16px;">🔌 Liaisons (Câbles)</label><div id="passages-container">${passagesHtml}</div></div>
  
  <div class="card">

    <div class="toggle-container"><input type="checkbox" id="boiteToggle" ${c.hasBoite ? 'checked' : ''}><label for="boiteToggle">Boîte posée</label></div>
    
    <button id="toggleSoudureBtn" class="btn btn-secondary" style="margin-top:10px; font-size:13px; padding:10px; background:${((hasBpe && c.hasBoite) || c.forceShowSoudure) ? '#ffcdd2' : '#c8e6c9'}; color:#333;">
      ${((hasBpe && c.hasBoite) || c.forceShowSoudure) ? '❌ Masquer la configuration des soudures' : '🔗 Forcer l\\'affichage des soudures'}
    </button>

    <div id="transfertBoiteDiv" style="display: ${c.hasBoite ? 'none' : 'block'}; margin-top:12px; background:#ffe0b2; padding:10px; border-radius:8px;">

    </div>
  </div>
  
  <div class="card"><label style="margin-top:0; font-size:16px;">📝 Commentaire Terrain</label><textarea id="notesInput" rows="3">${escapeHTML(c.notes)}</textarea></div>
  
  <div class="card"><label style="margin-top:0; font-size:16px;">📷 Photos requises</label><div class="photo-row" id="photoGrid"></div></div>

  <div class="card" id="cassettesCard" style="display: ${c.hasBoite ? 'block' : 'none'};"><div class="label-row"><label style="margin-top:0; font-size:16px;">🗃️ Photos des Cassettes (BPE)</label></div><div class="photo-row" id="cassettesGrid"></div></div>

  ${((hasBpe && c.hasBoite) || c.forceShowSoudure) ? `
  <div class="card" id="souduresConfigCard">
    <div class="label-row"><label style="margin-top:0; font-size:16px;">🔗 Configuration des soudures</label></div>
    <p class="small">Cochez "Droit" pour souder les 12 fibres sur le même tube.</p>
    <div id="souduresConfigGrid" style="display: flex; flex-direction: column; gap: 15px; margin-top:10px;"></div>
  </div>
  ` : ''}
  
  <button id="validateBtn" class="btn ${c.done?'btn-secondary':'btn-success'}" style="margin-bottom:8px;">${c.done?'↺ Rouvrir':'✓ Valider'}</button>
  <button id="nextBtn" class="btn" style="margin-bottom:8px;">Chambre suivante →</button>`;

  document.getElementById('editInfoBtn').onclick = () => openEditChambre(id);
  
  const photoGrid = document.getElementById('photoGrid');
  const renderPhotoGrid = () => {
    const currentCats = modeTravail === 'aiguillage' ? PHOTO_CATS_AIGUILLAGE : PHOTO_CATS_FOA;
    photoGrid.innerHTML = currentCats.map(cat => `<div class="photo-wrapper" data-cat-wrapper="${cat.id}">${photoSlot(cat, c.photos[cat.id])}</div>`).join('');
    photoGrid.querySelectorAll('input[type=file][data-cat]').forEach(inp=>{ inp.onchange=async()=>{ const files=Array.from(inp.files||[]);if(!files.length)return; const cat = inp.dataset.cat; showOverlay(true); try{ for(const f of files){ const blob=await compress(f); if(!c.photos[cat]) c.photos[cat] = []; c.photos[cat].push({id:crypto.randomUUID(),blob,ts:Date.now()}); } await dbPut(c);openDetail(id); }catch(err){alert('Erreur photo : '+err.message);} finally{showOverlay(false);} }; });
    photoGrid.querySelectorAll('[data-del-cat]').forEach(b=>{ b.onclick=async(e)=>{ e.stopPropagation();e.preventDefault(); if(!confirm(`Supprimer les photos ?`))return; c.photos[b.dataset.delCat]=[]; await dbPut(c);openDetail(id); }; });
  };
  renderPhotoGrid();

  const cassettesGrid = document.getElementById('cassettesGrid');
  const renderCassettes = () => {
    const cap = parseInt(c.capacite, 10) || 48; const nbCass = Math.ceil(cap / 12); let html = '';
    for (let i = 1; i <= nbCass; i++) {
      const catId = `CAS_${i}`; if(!c.photos[catId]) c.photos[catId] = [];
      html += `<div class="photo-wrapper">${photoSlot({ id: catId, label: `CAS ${i}`, icon: '🗃️' }, c.photos[catId])}</div>`;
    }
    cassettesGrid.innerHTML = html;
    cassettesGrid.querySelectorAll('input[type=file]').forEach(inp => {
      inp.onchange = async () => { const files = Array.from(inp.files || []); if (!files.length) return; const cat = inp.dataset.cat; showOverlay(true); try { for (const f of files) { const blob = await compress(f); c.photos[cat] = [{ id: crypto.randomUUID(), blob, ts: Date.now() }]; } await dbPut(c); openDetail(id); } catch (err) { alert('Erreur photo : ' + err.message); } finally { showOverlay(false); } };
    });
    cassettesGrid.querySelectorAll('[data-del-cat]').forEach(b => { b.onclick = async (e) => { e.stopPropagation(); e.preventDefault(); if (!confirm(`Supprimer ?`)) return; c.photos[b.dataset.delCat] = []; await dbPut(c); openDetail(id); }; });
  };
  if (c.hasBoite) renderCassettes();

  const renderSouduresConfig = () => {
    const grid = document.getElementById('souduresConfigGrid'); if(!grid) return; let html = '';
    for (let t = 1; t <= nbTubes; t++) {
      const tubeData = c.splicingData[t]; const isDroit = tubeData.droit;
      html += `<div class="splice-tube-block" data-tube="${t}"><div class="splice-tube-header"><span>Tube ${t} (${couleursNoms[t-1] || 'Couleur ' + t})</span><label style="cursor:pointer; display:flex; align-items:center; gap:5px;"><input type="checkbox" class="droit-toggle" data-tube="${t}" ${isDroit ? 'checked' : ''} style="width:auto; margin:0;"> Droit</label></div><table class="splice-table"><thead><tr><th>Fibre</th><th>Statut</th><th>Tube Dest.</th><th>Fibre Dest.</th></tr></thead><tbody>`;
      for (let f = 0; f < 12; f++) {
        const fib = tubeData.fibers[f]; const disabled = (isDroit || fib.status !== 'soude') ? 'disabled' : '';
        html += `<tr><td style="background-color:rgb(${couleursHex[couleursNoms[f]].join(',')}); color:${f===3||f===5||f===11?'#000':'#fff'}; font-weight:bold;">F${f+1}</td><td><select class="fib-status" data-tube="${t}" data-fib="${f}" ${isDroit ? 'disabled' : ''}><option value="soude" ${fib.status === 'soude' ? 'selected' : ''}>Soudé</option><option value="attente" ${fib.status === 'attente' ? 'selected' : ''}>Attente</option><option value="passage" ${fib.status === 'passage' ? 'selected' : ''}>Passage</option></select></td><td><input type="number" min="1" max="${nbTubes}" class="fib-dest-tube" data-tube="${t}" data-fib="${f}" value="${fib.destTube}" ${disabled}></td><td><input type="number" min="1" max="12" class="fib-dest-fib" data-tube="${t}" data-fib="${f}" value="${fib.destFib}" ${disabled}></td></tr>`;
      }
      html += `</tbody></table></div>`;
    }
    grid.innerHTML = html;
    grid.querySelectorAll('.droit-toggle').forEach(chk => { chk.onchange = async (e) => { const t = parseInt(e.target.dataset.tube); c.splicingData[t].droit = e.target.checked; if (e.target.checked) c.splicingData[t].fibers = Array.from({ length: 12 }, (_, i) => ({ status: 'soude', destTube: t, destFib: i + 1 })); await dbPut(c); renderSouduresConfig(); }; });
    grid.querySelectorAll('.fib-status').forEach(sel => { sel.onchange = async (e) => { const t = parseInt(e.target.dataset.tube), f = parseInt(e.target.dataset.fib); c.splicingData[t].fibers[f].status = e.target.value; await dbPut(c); renderSouduresConfig(); }; });
    grid.querySelectorAll('.fib-dest-tube, .fib-dest-fib').forEach(inp => { inp.onchange = async (e) => { const t = parseInt(e.target.dataset.tube), f = parseInt(e.target.dataset.fib); const val = parseInt(e.target.value) || 1; if (inp.classList.contains('fib-dest-tube')) c.splicingData[t].fibers[f].destTube = val; else c.splicingData[t].fibers[f].destFib = val; await dbPut(c); }; });
  };
  if ((hasBpe && c.hasBoite) || c.forceShowSoudure) renderSouduresConfig();

  const toggleSoudureBtn = document.getElementById('toggleSoudureBtn');
  if (toggleSoudureBtn) {
    toggleSoudureBtn.onclick = async () => { c.forceShowSoudure = !c.forceShowSoudure; await dbPut(c); openDetail(id); };
  }

  document.getElementById('capaciteSelect').onchange = async (e) => { c.capacite = parseInt(e.target.value, 10); await dbPut(c); openDetail(id); };
  cont.querySelectorAll('input[data-pass]').forEach(inp=>{ inp.oninput = (e) => { const passage = c.passages.find(x => x.id === inp.dataset.pass); if(passage) { passage[inp.dataset.field] = e.target.value; dbPut(c); } }; });
  document.getElementById('boiteToggle').onchange = (e) => { c.hasBoite = e.target.checked; dbPut(c); openDetail(id); };
  document.getElementById('bpeDestinationSelect').onchange = (e) => { c.bpeDestination = e.target.value; dbPut(c); };
  document.getElementById('notesInput').oninput = (e) => { c.notes = e.target.value; dbPut(c); };
  document.getElementById('validateBtn').onclick=async()=>{c.done=!c.done;await dbPut(c);openDetail(id);};
  document.getElementById('nextBtn').onclick=()=>{ const idx=chambres.findIndex(x=>x.id===id);const next=chambres[idx+1]; if(next)openDetail(next.id);else{renderList();showScreen('list');} };
  
  showScreen('detail');
}

  document.getElementById('editCodeCh1').value = getRawValue(c, ['CODE_CH1'], ''); document.getElementById('editCodeCh2').value = getRawValue(c, ['CODE_CH2'], '');

  document.getElementById('editRefChambr').value = getRawValue(c, ['REF_CHAMBR'], ''); document.getElementById('editNumVoie').value = getRawValue(c, ['NUM_VOIE'], '');
  document.getElementById('editLat').value = c.lat || ''; document.getElementById('editLon').value = c.lon || ''; document.getElementById('editNotes').value = c.notes || '';

function closeEditChambre() { editingId = null; editPendingLat = ''; editPendingLon = ''; document.getElementById('modalEditChambre').style.display = 'none'; }
async function confirmEditChambre() {
  if (!editingId) return; const c = chambres.find(x => x.id === editingId); if (!c) return;
  const newCodeCh1 = document.getElementById('editCodeCh1').value.trim(); if (!newCodeCh1) { alert("Le CODE_CH1 ne peut pas être vide."); return; }
  c.raw['CODE_CH1'] = newCodeCh1; c.raw['CODE_CH2'] = document.getElementById('editCodeCh2').value.trim(); c.raw['PROPRIETAI'] = document.getElementById('editProprietaire').value.trim();
  c.raw['COMMUNE'] = document.getElementById('editCommune').value.trim(); c.raw['REF_CHAMBR'] = document.getElementById('editRefChambr').value.trim(); c.raw['NUM_VOIE'] = document.getElementById('editNumVoie').value.trim();
  c.lat = editPendingLat || ''; c.lon = editPendingLon || ''; c.notes = document.getElementById('editNotes').value.trim();
  await dbPut(c); closeEditChambre(); updateHomeStats(); openDetail(editingId);
}

// PDF GENERATION
async function construireSynoptiquePDF() {
  if (!chambres.length) return null; const { jsPDF } = window.jspdf || {}; if (!jsPDF) return null;
  const nomProjet = document.getElementById('synoptiqueNomProjet').value.trim() || 'PROJET';
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a3' });
  const W = doc.internal.pageSize.getWidth(); const H = doc.internal.pageSize.getHeight(); const flipY = y => H - y;
  
  // Dummy Synoptique generation to keep it short here, assuming previous logic is intact
  doc.setFontSize(20); doc.text(`SYNOPTIQUE - ${nomProjet}`, W/2, 50, { align: 'center' });

  await ajouterPagesSoudure(doc, chambres, logoGauche, logoDroite);
  return { doc, nomProjet, nbPages: doc.internal.getNumberOfPages(), nbChambres: chambres.length };
}

async function ajouterPagesSoudure(doc, chambres, logoG, logoD) {
  const getTextColor = (rgb) => { const luminosite = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]); return luminosite > 128 ? [0, 0, 0] : [255, 255, 255]; };

  for (const c of chambres) {
    const r = c.raw || {}; const bpe = getVal(r, 'BPE') || '';
    if (!c.hasBoite && !c.forceShowSoudure) continue;
    const nomBoite = (bpe && bpe.trim() !== '' && bpe.toLowerCase() !== 'none') ? bpe : 'BOÎTE TRANSFÉRÉE / SANS NOM';
    
    const cableIn = getVal(r, 'CABLE') || 'CÂBLE INCONNU'; const chambreNom = getVal(r, 'CODE_CH1') || '—'; const commune = getVal(r, 'COMMUNE') || '—'; const codeSite = getVal(r, 'CODE_CH2', 'CODE_CH1') || '—'; const cableOut = getVal(r, 'CABLE_OUT') || cableIn + '_002'; const destination = getVal(r, 'DESTINATION') || 'TEH91';
    const capacite = parseInt(c.capacite, 10) || 48; const nbTubes = Math.ceil(capacite / 12);

    for (let t = 1; t <= nbTubes; t++) {
      doc.addPage('a4', 'landscape');
      const pageW = doc.internal.pageSize.getWidth(); const pageH = doc.internal.pageSize.getHeight();
      
      // LÉGENDE (Haut Gauche)
      doc.setDrawColor(200, 200, 200); doc.setFillColor(255, 255, 255); doc.rect(30, 30, 80, 40);
      doc.setFontSize(8); doc.setTextColor(0, 0, 0); doc.setFont('helvetica', 'normal'); doc.text('Épissure', 35, 40); 
      doc.setFont('helvetica', 'bold'); doc.setTextColor(255, 0, 0); doc.text('---*---', 65, 40);
      doc.setFont('helvetica', 'normal'); doc.setTextColor(0, 0, 0); doc.text('Passage', 35, 52); doc.text('---=>---', 65, 52); doc.text('À réaliser', 35, 64); doc.setFillColor(255, 255, 0); doc.rect(65, 61, 15, 5, 'F');

      // EN-TÊTE
      doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(0, 0, 0);
      doc.text(`PLAN DE SOUDURES - ${nomBoite}`, pageW / 2, 40, { align: 'center' });
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
      doc.text(`Chambre : ${chambreNom} | Commune : ${commune} | Code : ${codeSite}`, pageW / 2, 55, { align: 'center' });
      doc.text(`Tube ${t} / ${nbTubes} - ${new Date().toLocaleDateString('fr-FR')}`, pageW / 2, 70, { align: 'center' });

      if (logoG && logoG.dataUrl) try { doc.addImage(logoG.dataUrl, logoG.format, 30, 80, 50, 25); } catch(e){}
      if (logoD && logoD.dataUrl) try { doc.addImage(logoD.dataUrl, logoD.format, pageW - 80, 80, 50, 25); } catch(e){}

      try { const qrDataUrl = await QRCode.toDataURL(`BPE:${nomBoite} - Code:${codeSite}`, { margin: 1, width: 200 }); doc.addImage(qrDataUrl, 'PNG', pageW - 100, 20, 70, 70); doc.setFontSize(8); doc.setTextColor(100, 100, 100); doc.setFont('helvetica', 'bold'); doc.text("Localisation", pageW - 65, 95, { align: 'center' }); } catch(e){}

      // TABLEAU (A4 paysage en points)
      const startY = 120; const startX = 30; const rowHeight = 22;
      const colWidths = [45, 130, 40, 40, 60, 40, 40, 130, 255]; 
      const colNames = ['Source', 'Câble entrant', 'Tube', 'Fibre', 'Type', 'Fibre', 'Tube', 'Câble sortant', 'Destination'];
      const tableWidth = colWidths.reduce((a, b) => a + b, 0);

      doc.setFillColor(230, 230, 230); doc.rect(startX, startY, tableWidth, rowHeight, 'F'); doc.setDrawColor(0); doc.setLineWidth(0.5);
      
      let currentX = startX; doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
      for (let i = 0; i < colNames.length; i++) { doc.rect(currentX, startY, colWidths[i], rowHeight); let txt = colNames[i].replace(' (Bague)', ''); doc.text(txt, currentX + colWidths[i]/2, startY + 14, { align: 'center' }); currentX += colWidths[i]; }

      doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
      const tubeData = c.splicingData && c.splicingData[t] ? c.splicingData[t] : { droit: true, fibers: [] };

      for (let f = 0; f < 12; f++) {
        const rowY = startY + rowHeight + (f * rowHeight); const rgb = couleursHex[couleursNoms[f]]; const textColor = getTextColor(rgb);
        let fibData = tubeData.droit ? { status: 'soude', destTube: t, destFib: f + 1 } : tubeData.fibers[f];
        
        currentX = startX;
        for (let i = 0; i < colWidths.length; i++) {
          if (i !== 2 && i !== 6) doc.rect(currentX, rowY, colWidths[i], rowHeight);
          if (i === 3) { doc.setFillColor(rgb[0], rgb[1], rgb[2]); doc.rect(currentX, rowY, colWidths[i], rowHeight, 'F'); doc.setDrawColor(0); doc.rect(currentX, rowY, colWidths[i], rowHeight); }
          if (i === 5 && fibData.status === 'soude') { const destRgb = couleursHex[couleursNoms[fibData.destFib - 1]]; doc.setFillColor(destRgb[0], destRgb[1], destRgb[2]); doc.rect(currentX, rowY, colWidths[i], rowHeight, 'F'); doc.setDrawColor(0); doc.rect(currentX, rowY, colWidths[i], rowHeight); }
          currentX += colWidths[i];
        }

        currentX = startX; doc.setTextColor(0, 0, 0);
        doc.setFontSize(8); doc.text(nomBoite, currentX + colWidths[0]/2, rowY + 14, { align: 'center' }); currentX += colWidths[0];
        doc.setFontSize(9); if (f === 0) doc.text(cableIn.substring(0, 20), currentX + 5, rowY + 14); currentX += colWidths[1];
        currentX += colWidths[2];
        doc.setTextColor(textColor[0], textColor[1], textColor[2]); doc.setFont('helvetica', 'bold'); doc.text(`F${f+1}`, currentX + colWidths[3]/2, rowY + 14, { align: 'center' }); doc.setFont('helvetica', 'normal'); doc.setTextColor(0, 0, 0); currentX += colWidths[3];
        
        let typeStr = '---*---'; if (fibData.status === 'attente') typeStr = '---×---'; else if (fibData.status === 'passage') typeStr = '---=>---';
        doc.setFont('helvetica', 'bold'); if (fibData.status === 'soude') doc.setTextColor(255, 0, 0); doc.text(typeStr, currentX + colWidths[4]/2, rowY + 14, { align: 'center' }); doc.setFont('helvetica', 'normal'); doc.setTextColor(0, 0, 0); currentX += colWidths[4];
        
        if (fibData.status === 'soude') { const destRgb = couleursHex[couleursNoms[fibData.destFib - 1]]; const destTextColor = getTextColor(destRgb); doc.setFont('helvetica', 'bold'); doc.setTextColor(destTextColor[0], destTextColor[1], destTextColor[2]); doc.text(`F${fibData.destFib}`, currentX + colWidths[5]/2, rowY + 14, { align: 'center' }); doc.setFont('helvetica', 'normal'); doc.setTextColor(0, 0, 0); }
        currentX += colWidths[5]; currentX += colWidths[6];
        if (f === 0 && fibData.status === 'soude') doc.text(cableOut.substring(0, 20), currentX + 5, rowY + 14); currentX += colWidths[7];
        if (f === 0 && fibData.status === 'soude') doc.text(destination, currentX + 5, rowY + 14);
      }
      
      // TUBES FUSIONNÉS
      const tubeHeight = 12 * rowHeight; const tubeStartY = startY + rowHeight;
      const tubeX = startX + colWidths[0] + colWidths[1]; const tColor = couleursHex[couleursNoms[t-1] || 'Bleu']; const tTextColor = getTextColor(tColor);
      doc.setFillColor(tColor[0], tColor[1], tColor[2]); doc.rect(tubeX, tubeStartY, colWidths[2], tubeHeight, 'F'); doc.setDrawColor(0); doc.rect(tubeX, tubeStartY, colWidths[2], tubeHeight); 
      doc.setTextColor(tTextColor[0], tTextColor[1], tTextColor[2]); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(`1 ${couleursNoms[t-1] || ''}`, tubeX + colWidths[2]/2, tubeStartY + tubeHeight/2, { angle: 90, align: 'center' });
      
      const destTube = tubeData.droit ? t : (tubeData.fibers.find(f => f.status === 'soude')?.destTube || t);
      const tubeDestX = startX + colWidths[0] + colWidths[1] + colWidths[2] + colWidths[3] + colWidths[4] + colWidths[5]; const tDestColor = couleursHex[couleursNoms[destTube-1] || 'Bleu']; const tDestTextColor = getTextColor(tDestColor);
      doc.setFillColor(tDestColor[0], tDestColor[1], tDestColor[2]); doc.rect(tubeDestX, tubeStartY, colWidths[6], tubeHeight, 'F'); doc.setDrawColor(0); doc.rect(tubeDestX, tubeStartY, colWidths[6], tubeHeight);
      doc.setTextColor(tDestTextColor[0], tDestTextColor[1], tDestTextColor[2]); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(`1 ${couleursNoms[destTube-1] || ''}`, tubeDestX + colWidths[6]/2, tubeStartY + tubeHeight/2, { angle: 90, align: 'center' });
      doc.setTextColor(0, 0, 0); doc.setFont('helvetica', 'normal'); doc.setFontSize(9);

      // PHOTO
      const cassPhotos = c.photos[`CAS_${t}`] || []; const photoBoxY = 420; const photoBoxW = 200; const photoBoxH = 140; const photoBoxX = (pageW - photoBoxW) / 2;
      doc.setDrawColor(150, 150, 150); doc.setLineWidth(0.5); doc.rect(photoBoxX, photoBoxY, photoBoxW, photoBoxH);
      doc.setFontSize(10); doc.setFont('helvetica', 'bold'); doc.setTextColor(100, 100, 100); doc.text(`Photo Cassette ${t}`, photoBoxX, photoBoxY - 5);
      if (cassPhotos.length > 0 && cassPhotos[0].blob) {
        try { const imgDataUrl = await blobToDataURL(cassPhotos[0].blob); const imgProps = doc.getImageProperties(imgDataUrl); const imgRatio = imgProps.width / imgProps.height; let drawW = photoBoxW - 4; let drawH = drawW / imgRatio; if (drawH > photoBoxH - 4) { drawH = photoBoxH - 4; drawW = drawH * imgRatio; } const drawX = photoBoxX + (photoBoxW - drawW) / 2; const drawY = photoBoxY + (photoBoxH - drawH) / 2; doc.addImage(imgDataUrl, 'JPEG', drawX, drawY, drawW, drawH); } catch (e) { doc.setTextColor(255, 0, 0); doc.text("Erreur image", photoBoxX + 80, photoBoxY + 70); }
      } else { doc.setFontSize(10); doc.setTextColor(180, 180, 180); doc.setFont('helvetica', 'italic'); doc.text("Aucune photo", pageW / 2, photoBoxY + 70, { align: 'center' }); }
    }
  }
}

async function genererSynoptiquePDF() {
  showOverlay(true);
  try {
    const res = await construireSynoptiquePDF();
    if (!res) { alert("Erreur."); return; }
    const fname = `Dossier_Complet_TOP_SAT_${res.nomProjet.replace(/[^A-Za-z0-9_-]/g, '_')}.pdf`;
    res.doc.save(fname); alert(`✅ Dossier généré.`);
  } catch (e) { console.error(e); alert("Erreur :\n" + e.message); } finally { showOverlay(false); }
}

async function nouveauProjet() {

}

async function importCSV(file){
  try {
    showOverlay(true); const text = await file.text(); const rows = parseCSV(text);
    if (rows.length < 2) throw new Error("Fichier CSV invalide.");
    const saved = localStorage.getItem('releve_headers'); if (!saved) { headers = rows[0].map(h => h.trim()); localStorage.setItem('releve_headers', JSON.stringify(headers)); } else { try { headers = JSON.parse(saved); } catch(e) { headers = rows[0].map(h => h.trim()); localStorage.setItem('releve_headers', JSON.stringify(headers)); } }
    
    const dataRows = rows.slice(1); const ordreIdx = headers.findIndex(h => /^ORDRE$/i.test(h.trim())); const refIdx = headers.findIndex(h => /^REF_CHAMBR$/i.test(h.trim())); const codeCh2Idx = headers.findIndex(h => /^CODE_CH2$/i.test(h.trim()));
    const makeId = (raw) => { const parts = [ codeCh2Idx >= 0 ? (raw[headers[codeCh2Idx]] || '') : '', refIdx >= 0 ? (raw[headers[refIdx]] || '') : '', ordreIdx >= 0 ? (raw[headers[ordreIdx]] || '') : '' ]; const id = parts.filter(Boolean).join('|'); return id || ('CH-' + Math.random().toString(36).slice(2, 8).toUpperCase()); };
    const mapChambres = new Map();
    for (const r of dataRows) {
      if (r.length < 2) continue; const raw = {}; headers.forEach((h, i) => raw[h] = (r[i] || '').trim());
      if (!raw['ORDRE_GEO']) { const ordreVal = ordreIdx >= 0 ? (r[ordreIdx] || '').trim() : ''; if (ordreVal) raw['ORDRE_GEO'] = makeOrdreGeo(ordreVal); }
      const id = makeId(raw);
      if (!mapChambres.has(id)) mapChambres.set(id, { id, raw, done: false, hasBoite: true, bpeDestination: '', boiteNonPosee: false, notes: '', lat: '', lon: '', forceShowSoudure: false, capacite: parseInt(getRawValue({raw}, ['CAPACITE'], '48'), 10) || 48, photos: { ...PHOTO_CATS_AIGUILLAGE.reduce((acc, cat) => { acc[cat.id] = []; return acc; }, {}), ...PHOTO_CATS_FOA.reduce((acc, cat) => { acc[cat.id] = []; return acc; }, {}) }, passages: [{ id: crypto.randomUUID(), cable_name: '' }] });
    }
    if (mapChambres.size === 0) throw new Error("Aucune chambre valide.");
    const existingDb = new Map(chambres.map(c => [c.id, c])); const safeKeys = ['COMMUNE','PROPRIETAI','CODE_CH2','REF_CHAMBR','ORDRE','WAZE','FCI','ADRESSE','ETIQUETTE_2','NUM_VOIE','DIST_CHAMB','wkt_geom','BPE','CODE_CH1','CAPACITE'];
    const newC = Array.from(mapChambres.values()).map(newCh => {
      const oldCh = existingDb.get(newCh.id);
      if (oldCh) { for (const key of Object.keys(newCh.raw)) { const ku = key.toUpperCase(); if (ku === 'ORDRE_GEO') { if (!oldCh.raw['ORDRE_GEO'] && newCh.raw['ORDRE_GEO']) oldCh.raw['ORDRE_GEO'] = newCh.raw['ORDRE_GEO']; continue; } if (safeKeys.includes(ku)) oldCh.raw[key] = newCh.raw[key]; else if (!(key in oldCh.raw)) oldCh.raw[key] = newCh.raw[key]; } return oldCh; }
      return newCh;
    });
    await dbClear(); chambres = newC; for (const c of chambres) await dbPut(c);
    trierChambres(); updateHomeStats(); updateImportLock(); alert(`${chambres.length} chambre(s) prête(s).`);
  } catch(err) { alert("Erreur : \n" + err.message); } finally { showOverlay(false); }
}

function trierChambres() {
  chambres.forEach((c, i) => { c.__srcIndex = i; });
  chambres.sort((a, b) => { const ga = parseOrdreGeo(a.raw['ORDRE_GEO']); const gb = parseOrdreGeo(b.raw['ORDRE_GEO']); const oa = parseInt(a.raw['ORDRE'] || '', 10); const ob = parseInt(b.raw['ORDRE'] || '', 10); const va = ga !== 999999 ? ga : (isNaN(oa) ? 999999 : oa); const vb = gb !== 999999 ? gb : (isNaN(ob) ? 999999 : ob); if (va !== vb) return va - vb; return (a.__srcIndex || 0) - (b.__srcIndex || 0); });
  chambres.forEach(c => delete c.__srcIndex);
}

async function exportAll(){
  if(!chambres.length){alert('Rien à exporter.');return;}
  showOverlay(true);
  try{
    trierChambres(); const zip=new JSZip(); zip.file('releve_chambres.csv', '\uFEFF' + generateCSV());
    try { const pdfRes = await construireSynoptiquePDF(); if (pdfRes) { const pdfBlob = pdfRes.doc.output('blob'); const pdfName = `Dossier_Complet_${pdfRes.nomProjet.replace(/[^A-Za-z0-9_-]/g, '_')}.pdf`; zip.file(pdfName, pdfBlob); } } catch(e) { console.warn("PDF non généré", e); }
    const allCats = [...PHOTO_CATS_AIGUILLAGE, ...PHOTO_CATS_FOA]; const uniqueCats = Array.from(new Set(allCats.map(c => c.id))).map(id => allCats.find(c => c.id === id));
    for(const c of chambres){
      const folderName = (getRawValue(c, ['CODE_CH1'], '') || c.id).replace(/[^A-Za-z0-9_-]/g,'_'); const bpeName = (c.raw['BPE'] || 'Sans_Boite').replace(/[^A-Za-z0-9_-]/g,'_');
      uniqueCats.forEach(catObj => { const photos = c.photos[catObj.id] || []; photos.forEach((p, i) => { const n = String(i + 1).padStart(2, '0'); zip.file(`photos/${folderName}/${catObj.id}/${catObj.id}_${n}.jpg`, p.blob); }); });
      Object.keys(c.photos).forEach(catKey => { if (catKey.startsWith('CAS_')) { const cassName = catKey.replace('_', ''); const photos = c.photos[catKey] || []; photos.forEach((p, i) => { const n = String(i + 1).padStart(2, '0'); zip.file(`photos/${folderName}/${bpeName}/${cassName}/${cassName}_${n}.jpg`, p.blob); }); } });
    }
    const blob = await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    const fname = 'TOP_SAT_SERVICES_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.zip';
    const file = new File([blob], fname, { type: 'application/zip' });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Relevé', text: 'Dossier complet' }); } else { throw new Error("Non supporté"); } } catch (err) { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 60000); alert("Le partage direct a été bloqué. Fichier téléchargé."); }
  }catch(e){alert('Erreur export : '+e.message);} finally{showOverlay(false);}
}

  const wazeUrl = (pendingLat && pendingLon) ? `https://www.waze.com/ul?ll=${pendingLat},${pendingLon}&navigate=yes` : '';
  const maxGeo = chambres.reduce((m, c) => { const v = parseOrdreGeo(c.raw['ORDRE_GEO']); return Math.max(m, v === 999999 ? 0 : v); }, 0);
  const newOrdreGeo = 'A' + (maxGeo + 1); const newOrdre = String(maxGeo + 1);
  const compositeId = [document.getElementById('newCodeCh2').value.trim(), document.getElementById('newRefChambr').value.trim(), newOrdre].filter(Boolean).join('|') || newId;
  const newCh = { id: compositeId, raw: { 'CODE_CH1': newId, 'WAZE': wazeUrl, 'PROPRIETAI': document.getElementById('newProprietaire').value.trim(), 'CODE_CH2': document.getElementById('newCodeCh2').value.trim(), 'COMMUNE': document.getElementById('newCommune').value.trim(), 'REF_CHAMBR': document.getElementById('newRefChambr').value.trim(), 'NUM_VOIE': document.getElementById('newNumVoie').value.trim(), 'ORDRE': newOrdre, 'ORDRE_GEO': newOrdreGeo }, done: false, hasBoite: true, bpeDestination: '', boiteNonPosee: false, notes: document.getElementById('newComment').value.trim(), lat: pendingLat, lon: pendingLon, forceShowSoudure: false, capacite: 48, photos: { ...PHOTO_CATS_AIGUILLAGE.reduce((acc, cat) => { acc[cat.id] = []; return acc; }, {}), ...PHOTO_CATS_FOA.reduce((acc, cat) => { acc[cat.id] = []; return acc; }, {}) }, passages: [{ id: crypto.randomUUID(), cable_name: '' }] };
  chambres.splice(idx + 1, 0, newCh); await dbPut(newCh); trierChambres(); updateHomeStats(); document.getElementById('modalAddChambre').style.display = 'none'; alert(`Chambre ${newId} ajoutée.`);
};
